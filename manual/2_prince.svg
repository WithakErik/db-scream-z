<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" width="60mm" height="80mm">
  <style>
    .knob        { fill: #ffffff; stroke: #000000; stroke-width: 0.4; }
    .toggle-slot { fill: #f0f0f0; stroke: #000000; stroke-width: 0.35; }
    .detent      { stroke: #888888; stroke-width: 0.25; }
    .m1-line     { stroke: #E65100; stroke-width: 0.35; stroke-linecap: round; }
    .m2-line     { stroke: #00838F; stroke-width: 0.35; stroke-dasharray: 0.45, 0.75; stroke-linecap: round; }
    .m3-line     { stroke: #6A1B9A; stroke-width: 0.4;  stroke-dasharray: 0, 1.2; stroke-linecap: round; }
    .m1-dot      { fill: #E65100; }
    .m2-dot      { fill: #00838F; }
    .m3-dot      { fill: #6A1B9A; }
    .or-label    { font-family: sans-serif; font-size: 1.5px; font-weight: bold; text-anchor: middle; fill: #000000; }
  </style>
  <circle class="knob" cx="15" cy="10" r="4"/><circle class="knob" cx="30" cy="10" r="4"/><circle class="knob" cx="45" cy="10" r="4"/>
  <circle class="knob" cx="15" cy="30" r="4"/><circle class="knob" cx="30" cy="30" r="4"/><circle class="knob" cx="45" cy="30" r="4"/>
  <circle cx="15" cy="10" r="0.4" fill="#0"/><circle cx="30" cy="10" r="0.4" fill="#0"/><circle cx="45" cy="10" r="0.4" fill="#0"/>
  <circle cx="15" cy="30" r="0.4" fill="#0"/><circle cx="30" cy="30" r="0.4" fill="#0"/><circle cx="45" cy="30" r="0.4" fill="#0"/>

  <!-- K1 -->
  <line class="m1-line" x1="15" y1="10" x2="11.5" y2="16.06"/><circle class="m1-dot" cx="11.5" cy="16.06" r="0.4"/>
  <line class="m2-line" x1="15" y1="10" x2="13.19" y2="3.24"/><circle class="m2-dot" cx="13.19" cy="3.24" r="0.4"/>
  <line class="m3-line" x1="15" y1="10" x2="11.41" y2="3.99"/><circle class="m3-dot" cx="11.41" cy="3.99" r="0.4"/>

  <!-- K2 -->
  <line class="m1-line" x1="30" y1="10" x2="26.5" y2="16.06"/><circle class="m1-dot" cx="26.5" cy="16.06" r="0.4"/>
  <line class="m2-line" x1="30" y1="10" x2="24.13" y2="13.81"/><circle class="m2-dot" cx="24.13" cy="13.81" r="0.4"/>
  <line class="m3-line" x1="30" y1="10" x2="23.68" y2="13.01"/><circle class="m3-dot" cx="23.68" cy="13.01" r="0.4"/>

  <!-- K3 -->
  <line class="m1-line" x1="45" y1="10" x2="45" y2="3"/><circle class="m1-dot" cx="45" cy="3" r="0.4"/>
  <line class="m2-line" x1="45" y1="10" x2="45" y2="3"/><circle class="m2-dot" cx="45" cy="3" r="0.4"/>
  <line class="m3-line" x1="45" y1="10" x2="45" y2="3"/><circle class="m3-dot" cx="45" cy="3" r="0.4"/>

  <!-- K4 -->
  <line class="m1-line" x1="15" y1="30" x2="15" y2="23"/><circle class="m1-dot" cx="15" cy="23" r="0.4"/>
  <line class="m2-line" x1="15" y1="30" x2="8.94" y2="26.51"/><circle class="m2-dot" cx="8.94" cy="26.51" r="0.4"/>
  <line class="m3-line" x1="15" y1="30" x2="14.88" y2="23.00"/><circle class="m3-dot" cx="14.88" cy="23.00" r="0.4"/>

  <!-- K5 -->
  <line class="m1-line" x1="30" y1="30" x2="26.5" y2="36.06"/><circle class="m1-dot" cx="26.5" cy="36.06" r="0.4"/>
  <line class="m2-line" x1="30" y1="30" x2="23.85" y2="33.34"/><circle class="m2-dot" cx="23.85" cy="33.34" r="0.4"/>
  <line class="m3-line" x1="30" y1="30" x2="23.11" y2="31.22"/><circle class="m3-dot" cx="23.11" cy="31.22" r="0.4"/>

  <!-- K6 -->
  <line class="m1-line" x1="45" y1="30" x2="45" y2="23"/><circle class="m1-dot" cx="45" cy="23" r="0.4"/>
  <line class="m2-line" x1="45" y1="30" x2="45" y2="23"/><circle class="m2-dot" cx="45" cy="23" r="0.4"/>
  <line class="m3-line" x1="45" y1="30" x2="38.11" y2="31.22"/><circle class="m3-dot" cx="38.11" cy="31.22" r="0.4"/>

  <!-- Toggles -->
  <g transform="translate(13, 50)"><rect class="toggle-slot" x="0" y="0" width="4" height="12" rx="1"/><line class="detent" x1="4" y1="2" x2="5" y2="2"/><line class="detent" x1="4" y1="6" x2="5" y2="6"/><line class="detent" x1="4" y1="10" x2="5" y2="10"/><circle class="m1-dot" cx="8" cy="6" r="1.2"/></g>
  <g transform="translate(28, 50)"><rect class="toggle-slot" x="0" y="0" width="4" height="12" rx="1"/><line class="detent" x1="4" y1="2" x2="5" y2="2"/><line class="detent" x1="4" y1="6" x2="5" y2="6"/><line class="detent" x1="4" y1="10" x2="5" y2="10"/><circle class="m1-dot" cx="8" cy="2" r="1.2"/><text x="8" y="6.5" class="or-label">OR</text><circle class="m1-dot" cx="8" cy="10" r="1.2"/></g>
  <g transform="translate(43, 50)"><rect class="toggle-slot" x="0" y="0" width="4" height="12" rx="1"/><line class="detent" x1="4" y1="2" x2="5" y2="2"/><line class="detent" x1="4" y1="6" x2="5" y2="6"/><line class="detent" x1="4" y1="10" x2="5" y2="10"/><circle class="m1-dot" cx="8" cy="6" r="1.2"/></g>
</svg>
